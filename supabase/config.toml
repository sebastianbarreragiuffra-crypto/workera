# For detailed configuration reference documentation, visit:
# https://supabase.com/docs/guides/local-development/cli/config
# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "Workera"

# Shared, project-scoped local configuration. These ports are intentionally
# committed so every PC runs Workera with the same URLs while other Supabase
# projects can keep the default 5432x range. Do not change them per machine;
# coordinate a repository change if this range ever collides locally.

[api]
enabled = true
# Port to use for the API URL.
port = 54421
# Schemas to expose in your API. Tables, views and stored procedures in this schema will get API
# endpoints. `public` and `graphql_public` schemas are included by default.
schemas = ["public", "graphql_public"]
# Extra schemas to add to the search_path of every request.
extra_search_path = ["public", "extensions"]
# The maximum number of rows returns from a view, table, or stored procedure.
max_rows = 1000

[api.tls]
enabled = false
# cert_path = "../certs/my-cert.pem"
# key_path = "../certs/my-key.pem"

[db]
# Port to use for the local database URL.
port = 54422
# Port used by db diff command to initialize the shadow database.
shadow_port = 54420
# Maximum amount of time to wait for health check when starting the local database.
health_timeout = "2m"
major_version = 17

[db.pooler]
enabled = false
port = 54429
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

# [db.vault]
# secret_key = "env(SECRET_VALUE)"

[db.migrations]
enabled = true
schema_paths = []

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[db.network_restrictions]
enabled = false
allowed_cidrs = ["0.0.0.0/0"]
allowed_cidrs_v6 = ["::/0"]

# [db.ssl_enforcement]
# enabled = true

[realtime]
enabled = true
# ip_version = "IPv6"
# max_header_length = 4096

[studio]
enabled = true
# Port to use for Supabase Studio.
port = 54423
# External URL of the API server that frontend connects to.
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[local_smtp]
enabled = true
# Port to use for the email testing server web interface.
port = 54424
# smtp_port = 54425
# pop3_port = 54426
# admin_email = "admin@email.com"
# sender_name = "Admin"

[storage]
enabled = true
file_size_limit = "50MiB"

# [storage.buckets.images]
# public = false
# file_size_limit = "50MiB"
# allowed_mime_types = ["image/png", "image/jpeg"]
# objects_path = "./images"

[storage.s3_protocol]
enabled = true

# [storage.image_transformation]
# enabled = true

[storage.analytics]
enabled = false
max_namespaces = 5
max_tables = 10
max_catalogs = 2

[storage.vector]
enabled = true
max_buckets = 10
max_indexes = 5

[auth]
enabled = true
# The base URL of your website.
site_url = "http://127.0.0.1:3000"

# The public URL that Auth serves on.
# external_url = ""

# Local PKCE callbacks generated by src/app/login/actions.ts. Both hostnames
# are required because developers may open the app with either one.
additional_redirect_urls = [
  "http://127.0.0.1:3000/**",
  "http://localhost:3000/**"
]

jwt_expiry = 3600
# jwt_issuer = ""
# signing_keys_path = "./signing_keys.json"

enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10

enable_signup = true
enable_anonymous_sign_ins = false
enable_manual_linking = false

minimum_password_length = 6
password_requirements = ""

# [auth.passkey]
# enabled = false

# [auth.webauthn]
# rp_display_name = "Supabase"
# rp_id = "localhost"
# rp_origins = ["http://127.0.0.1:3000"]

[auth.rate_limit]
email_sent = 2
sms_sent = 30
anonymous_users = 30
token_refresh = 150
sign_in_sign_ups = 30
token_verifications = 30
web3 = 30

# [auth.captcha]
# enabled = true
# provider = "hcaptcha"
# secret = ""

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false
secure_password_change = false
max_frequency = "1s"
otp_length = 6
otp_expiry = 3600

# [auth.email.smtp]
# enabled = true
# host = "smtp.sendgrid.net"
# port = 587
# user = "apikey"
# pass = "env(SENDGRID_API_KEY)"
# admin_email = "admin@email.com"
# sender_name = "Admin"

[auth.email.template.invite]
subject = "Te invitaron a GESTORA"
content_path = "./supabase/templates/invite.html"

# [auth.email.notification.password_changed]
# enabled = true
# subject = "Your password has been changed"
# content_path = "./templates/password_changed_notification.html"

[auth.sms]
enable_signup = false
enable_confirmations = false
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# [auth.sms.test_otp]
# 4152127777 = "123456"

# [auth.sessions]
# timebox = "24h"
# inactivity_timeout = "8h"

# [auth.hook.before_user_created]
# enabled = true
# uri = "pg-functions://postgres/auth/before-user-created-hook"

# [auth.hook.custom_access_token]
# enabled = true
# uri = "pg-functions://<database>/<schema>/<hook_name>"

[auth.sms.twilio]
enabled = false
account_sid = ""
message_service_sid = ""
auth_token = "env(SUPABASE_AUTH_SMS_TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

# TOTP habilitado: es el segundo factor de las cuentas privilegiadas
# (docs/MFA_DESIGN.md). Sin esto, `supabase.auth.mfa.enroll()` falla y la
# pantalla de inscripción no puede funcionar. El equivalente hosted se
# habilita en el panel del proyecto; config.toml solo gobierna la pila local.
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

# El factor por SMS queda deshabilitado a propósito y no debe habilitarse:
# el diseño descarta `phone` explícitamente (sección 2).
[auth.mfa.phone]
enroll_enabled = false
verify_enabled = false
otp_length = 6
template = "Your code is {{ .Code }}"
max_frequency = "5s"

# [auth.mfa.web_authn]
# enroll_enabled = true
# verify_enabled = true

[auth.external.apple]
enabled = false
client_id = ""
secret = "env(SUPABASE_AUTH_EXTERNAL_APPLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false
email_optional = false

# Google OAuth.
# Credentials must stay in environment variables.
[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""
url = ""
skip_nonce_check = false

[auth.web3.solana]
enabled = false

[auth.third_party.firebase]
enabled = false
# project_id = "my-firebase-project"

[auth.third_party.auth0]
enabled = false
# tenant = "my-tenant"
# tenant_region = "us"

[auth.third_party.aws_cognito]
enabled = false
# user_pool_id = "my-user-pool-id"
# user_pool_region = "us-east-1"

[auth.third_party.clerk]
enabled = false
# domain = "example.clerk.accounts.dev"

[auth.oauth_server]
enabled = false
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = false

[edge_runtime]
enabled = true
policy = "per_worker"
# Changed from 8083 so Workera has its own local inspector port.
inspector_port = 8093
deno_version = 2

# [edge_runtime.secrets]
# secret_key = "env(SECRET_VALUE)"

[analytics]
enabled = true
port = 54427
backend = "postgres"

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"

[experimental.pgdelta]
enabled = true
# declarative_schema_path = "./database"
# format_options = "{\"keywordCase\":\"upper\",\"indent\":2,\"maxWidth\":80,\"commaStyle\":\"trailing\"}"
