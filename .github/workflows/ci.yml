name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: Lint, typecheck, adapter tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full application test suite (mock only, no external network)
        run: npm test

      - name: Build
        run: npm run build

  database:
    name: Migrations and pgTAP suite
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm Docker is available
        run: docker info

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.116.0"

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (apply all migrations from scratch)
        run: supabase db reset

      - name: Run pgTAP test suite
        run: supabase test db --local supabase/tests

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
