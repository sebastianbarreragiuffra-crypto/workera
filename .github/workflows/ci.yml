name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-quality:
    name: Lint, typecheck, adapter tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Reject late or duplicate migration timestamps
        env:
          MIGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: npx tsx scripts/validate-migration-order.mts "$MIGRATION_BASE_SHA"

      - name: Dependency vulnerability audit
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Generate Next.js route types
        run: npx next typegen

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Full application test suite (mock only, no external network)
        run: npm test

      - name: Enforce local synthetic readiness policy
        run: npm run readiness:local

      - name: Build
        run: npm run build

  database:
    name: Migrations, pgTAP, and browser smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.19.0"
          cache: "npm"

      - name: Install application dependencies
        run: npm ci

      - name: Confirm Docker is available
        run: docker info

      - name: Set up Supabase CLI (pinned)
        uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: "2.116.0"

      - name: Start local Supabase stack
        run: supabase start

      - name: Reset database (apply all migrations from scratch)
        run: supabase db reset

      - name: Run pgTAP test suite
        run: supabase test db --local supabase/tests

      - name: Lint database schemas
        run: supabase db lint --level warning

      - name: Export isolated Supabase settings for the browser tests
        shell: bash
        run: |
          eval "$(supabase status -o env)"
          echo "NEXT_PUBLIC_SUPABASE_URL=${API_URL}" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${ANON_KEY}" >> "$GITHUB_ENV"

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Run browser end-to-end tests against the isolated stack
        env:
          MFA_ENFORCEMENT_ENABLED: "true"
          WORKERA_PROVIDER: "disabled"
        run: npm run test:e2e

      - name: Upload browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-diagnostics
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
